.auth{min-height:100vh;display:grid;place-items:center;padding:22px}.authCard{width:min(100%,520px);background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:29px;box-shadow:var(--shadow)}.brand{display:flex;gap:12px;align-items:center}.brandMark,.avatar{display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),#8d35ff);color:#fff;font-weight:950}.brandMark{width:50px;height:50px;border-radius:15px}.avatar{width:39px;height:39px;border-radius:50%}.authHero{padding:35px 0 22px}.authHero h1{font-size:42px;line-height:1.02;margin:12px 0}.authHero p{color:var(--muted);line-height:1.6}.form{display:grid;gap:13px}.field{display:grid;gap:7px;font-size:12px;font-weight:800}.input,.select,.textarea{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:13px;padding:12px 13px;outline:none}.textarea{min-height:120px;resize:vertical}.input:focus,.select:focus,.textarea:focus{border-color:var(--pink)}
.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:30;height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px)}.topTitle{min-width:0}.topTitle h2{font-size:17px;margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topActions{display:flex;align-items:center;gap:8px}.iconBtn{border:1px solid var(--line);background:var(--panel);color:var(--text);width:39px;height:39px;border-radius:12px}

.heroCard{background:linear-gradient(145deg,var(--panel),color-mix(in srgb,var(--panel) 88%,var(--pink)));border:1px solid var(--line);border-radius:24px;padding:25px}.heroCard h1{font-size:37px;line-height:1;margin:10px 0}.heroCard p{color:var(--muted);max-width:760px;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:17px}.stat .label{color:var(--muted);font-size:11px;font-weight:800}.stat .value{font-size:27px;font-weight:950;margin-top:8px}.stat .sub{color:var(--muted);font-size:11px;margin-top:4px}.progressTrack{height:9px;background:var(--panel3);border-radius:99px;overflow:hidden;margin-top:10px}.progressTrack span{display:block;height:100%;background:linear-gradient(90deg,var(--pink),#a23dff);border-radius:99px}
.twoCol{display:grid;grid-template-columns:1.35fr .85fr;gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:19px}.panel h3{margin:0 0 13px}.panelHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}
.moduleGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.moduleCard{min-height:170px;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:19px;padding:17px;display:flex;flex-direction:column}.moduleCard:not(.locked):hover{border-color:rgba(255,79,163,.5)}.moduleCard.locked{opacity:.52}.moduleCard .num{font-size:10px;color:var(--pink);font-weight:950;letter-spacing:.12em}.moduleCard h3{margin:13px 0 7px}.moduleCard p{font-size:12px;line-height:1.5;color:var(--muted);margin:0 0 14px}.moduleMeta{margin-top:auto;display:flex;justify-content:space-between;gap:9px;align-items:center}.status{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:6px 8px}.status.good{color:var(--good);border-color:rgba(120,219,170,.28)}.status.pink{color:var(--pink);border-color:rgba(255,79,163,.28)}
.week{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}.week>summary{padding:17px 18px;font-weight:900;cursor:pointer}.weekBody{border-top:1px solid var(--line);padding:16px}.dayList{display:grid;gap:11px}.day{background:var(--panel2);border:1px solid var(--line);border-radius:16px;overflow:hidden}.day.locked{opacity:.6}.day>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 15px;cursor:pointer}.day>summary::-webkit-details-marker{display:none}.dayTitle{display:flex;gap:11px;align-items:center;min-width:0}.dayNum{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:rgba(255,79,163,.1);color:var(--pink);font-size:11px;font-weight:950}.dayName{font-weight:900}.daySub{font-size:11px;color:var(--muted);margin-top:3px}.dayBody{border-top:1px solid var(--line);padding:16px}.section{margin-top:17px}.section h4{margin:0 0 8px}.section p,.section li{color:var(--muted);line-height:1.58}.conceptGrid,.visualGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.concept{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px}.concept b{font-size:13px}.concept p{margin:5px 0 0;font-size:12px}.visual{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}.visual.hero{grid-column:1/-1}.visual img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}.visual.hero img{aspect-ratio:16/9}.visual figcaption{padding:10px 12px;font-size:11px;color:var(--muted)}.schedule{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.schedule div{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:10px;font-size:11px}

async function refreshSession(){
 if(!session?.refresh_token) throw new Error('Sesión expirada');
 const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});
 const d=await r.json().catch(()=>null); if(!r.ok) throw new Error(d?.message||'No se pudo renovar la sesión');
 session=d;user=d.user||user;localStorage.setItem('kosmik_session',JSON.stringify(session));return d;
}
async function api(path,opts={},attempt=0){
 const headers={apikey:SUPABASE_KEY,'Content-Type':'application/json',...(session?.access_token?{Authorization:'Bearer '+session.access_token}:{}),...(opts.headers||{})};
 const r=await fetch(SUPABASE_URL+path,{...opts,headers});
 const text=await r.text();let d=null;try{d=text?JSON.parse(text):null}catch{d=text}
 if(!r.ok){
  const msg=d?.message||d?.msg||d?.error_description||d?.error||('HTTP '+r.status);
  if(attempt<1&&session?.refresh_token&&(r.status===401||String(msg).toLowerCase().includes('jwt'))){await refreshSession();return api(path,opts,attempt+1)}
  throw new Error(msg)
 }
 return d;
}
async function authLogin(email,password){
 const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
 const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(d?.error_description||d?.message||'Credenciales incorrectas');return d;
}
async function authCreateStudent(email,password,displayName){
 const r=await fetch(SUPABASE_URL+'/auth/v1/signup',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password,data:{full_name:displayName}})});
 const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(d?.msg||d?.message||d?.error_description||'No se pudo crear la cuenta');return d;
}
async function uploadCampusImage(file,path){
 const r=await fetch(SUPABASE_URL+'/storage/v1/object/campus-images/'+path,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+session.access_token,'x-upsert':'true','Content-Type':file.type||'application/octet-stream'},body:file});
 const d=await r.text();if(!r.ok)throw new Error(d||'No se pudo subir la imagen');
 return SUPABASE_URL+'/storage/v1/object/public/campus-images/'+path;
}

function statusLabel(a){
 if(!a?.is_unlocked)return'Bloqueado';
 if(a.academic_status==='completed')return'Completado';
 if(a.academic_status==='validated')return'Validado';
 return'En progreso';
}
function tagStatus(s){
 const x=String(s||'').toLowerCase();
 const cls=x.includes('paid')||x.includes('complet')||x.includes('respond')?'good':x.includes('overdue')||x.includes('venc')?'bad':'warn';
 return '<span class="tag '+cls+'">'+esc(s||'pendiente')+'</span>';
}

function renderNav(){
 let h='<div class="navGroup">ALUMNA</div>';
 h+=NAV_STUDENT.map(x=>`<button class="navBtn ${currentView===x[0]?'active':''}" data-view="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('');
 if(isAdmin){
  h+='<div class="navGroup">ADMINISTRACIÓN</div>';
  h+=NAV_ADMIN.map(x=>`<button class="navBtn ${currentView===x[0]?'active':''}" data-view="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('');
 }
 $('sidebar').innerHTML=h;
 $('sidebar').querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>navigate(b.dataset.view));
}
async function navigate(v){
 currentView=v;renderNav();window.scrollTo({top:0,behavior:'smooth'});
 const titles={home:'Inicio',learning:'Mi aprendizaje',events:'Mis eventos',payments:'Pagos',questions:'Tengo una duda',profile:'Perfil','admin-dashboard':'Administración','admin-students':'Alumnas','admin-content':'Contenido','admin-events':'Eventos','admin-payments':'Pagos administrativos','admin-questions':'Dudas de alumnas'};
 setPageTitle(titles[v]||'Campus');
 try{
  if(v==='home')return renderHome();
  if(v==='learning')return renderLearning();
  if(v==='events')return renderEvents();
  if(v==='payments')return renderPayments();
  if(v==='questions')return renderQuestions();
  if(v==='profile')return renderProfile();
  if(v==='admin-dashboard')return renderAdminDashboard();
  if(v==='admin-students')return renderAdminStudents();
  if(v==='admin-content')return renderAdminContent();
  if(v==='admin-events')return renderAdminEvents();
  if(v==='admin-payments')return renderAdminPayments();
  if(v==='admin-questions')return renderAdminQuestions();
 }catch(e){$('view').innerHTML='<div class="empty"><b>No se pudo cargar esta sección.</b><br><br>'+esc(e.message)+'</div>'}
}

async function boot(){
 $('auth').hidden=true;$('app').hidden=false;
 try{await api('/rest/v1/rpc/sync_my_module_access',{method:'POST',body:'{}'})}catch{}
 const [ps,mods,acc,dash]=await Promise.all([
  api('/rest/v1/profiles?id=eq.'+encodeURIComponent(user.id)+'&select=*'),
  api('/rest/v1/modules?is_active=eq.true&select=id,title,description,position,duration_weeks,start_week,is_active&order=position.asc'),
  api('/rest/v1/module_access?student_id=eq.'+encodeURIComponent(user.id)+'&select=module_id,is_unlocked,academic_status'),
  api('/rest/v1/rpc/get_my_dashboard',{method:'POST',body:'{}'}).catch(()=>({}))
 ]);
 profile=ps?.[0]||{};modules=mods||[];moduleAccess=new Map((acc||[]).map(x=>[x.module_id,x]));dashboard=unwrap(dash)||{};
 isAdmin=profile?.role==='admin';$('adminBadge').hidden=!isAdmin;
 const n=nameFrom(profile,user);$('avatar').textContent=initials(n);
 currentView=isAdmin?'admin-dashboard':'home';renderNav();await navigate(currentView);
}

function renderHome(){

 const current=modules.find(m=>m.id===dashboard.current_module_id);
 $('view').innerHTML=`
 <div class="page">

function renderJSON(v,depth=0){
 if(v==null)return'';
 if(['string','number','boolean'].includes(typeof v))return'<p>'+esc(v)+'</p>';

 return'';
}

async function checkQuiz(id){

function renderProfile(){

 $('view').innerHTML=`<div class="page"><div class="pageHead"><div><p class="eyebrow">CUENTA</p><h1>Perfil</h1><p>Información básica de tu acceso al Campus.</p></div></div><section class="panel"><form id="profileForm" class="form"><label class="field">Nombre<input id="pName" class="input" value="${esc(n)}"></label><label class="field">Correo<input class="input" value="${esc(user.email||'')}" disabled></label><label class="field">Teléfono<input id="pPhone" class="input" value="${esc(profile.phone||'')}"></label><button class="btn primary" type="submit">Guardar cambios</button><div id="pMsg"></div></form></section><div class="notice">Tu avance académico se conserva aunque actualicemos el diseño o agreguemos contenido al Campus.</div></div>`;
 $('profileForm').onsubmit=async e=>{e.preventDefault();try{await api('/rest/v1/profiles?id=eq.'+user.id,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({display_name:$('pName').value.trim(),phone:$('pPhone').value.trim()})});profile.display_name=$('pName').value.trim();profile.phone=$('pPhone').value.trim();$('pMsg').innerHTML='<span class="success">Perfil actualizado.</span>'}catch(x){$('pMsg').innerHTML='<span class="error">'+esc(x.message)+'</span>'}};
}

async function renderAdminDashboard(){
 if(!isAdmin)return navigate('home');
 const s=unwrap(await api('/rest/v1/rpc/admin_dashboard_summary',{method:'POST',body:'{}'}))||{};
 $('view').innerHTML=`<div class="page"><div class="pageHead"><div><p class="eyebrow">ADMINISTRACIÓN</p><h1>Panel de control</h1><p>Vista general del Campus Kosmik Soul.</p></div></div><div class="stats"><div class="stat"><div class="label">ALUMNAS ACTIVAS</div><div class="value">${esc(s.students||0)}</div></div><div class="stat"><div class="label">DUDAS PENDIENTES</div><div class="value">${esc(s.open_questions||0)}</div></div><div class="stat"><div class="label">EVENTOS PRÓXIMOS</div><div class="value">${esc(s.upcoming_events||0)}</div></div><div class="stat"><div class="label">PAGOS VENCIDOS</div><div class="value">${esc(s.overdue_payments||0)}</div></div></div><div class="twoCol"><section class="panel"><h3>Finanzas administrativas</h3><div style="font-size:30px;font-weight:950">${money(s.total_collected||0)}</div><p class="muted">Total registrado como pagado. Este dato solo es visible para administración.</p><button class="btn small" onclick="navigate('admin-payments')">Administrar pagos</button></section><section class="panel"><h3>Acciones rápidas</h3><div class="row"><button class="btn small" onclick="navigate('admin-students')">Alumnas</button><button class="btn small" onclick="navigate('admin-events')">Crear evento</button><button class="btn small" onclick="navigate('admin-content')">Editar contenido</button></div></section></div></div>`;
}

async function renderAdminStudents(){
 $('view').innerHTML='<div class="empty">Cargando alumnas…</div>';
 const rows=await api('/rest/v1/rpc/admin_list_students',{method:'POST',body:'{}'});adminStudentsCache=rows||[];
 $('view').innerHTML=`<div class="page"><div class="pageHead"><div><p class="eyebrow">ADMINISTRACIÓN</p><h1>Alumnas</h1><p>Consulta avance y coloca a cada alumna en el módulo que corresponda.</p></div><button class="btn primary" id="newStudentBtn">+ Crear acceso</button></div><div class="notice">El alta usa el sistema seguro de Auth de Supabase. Si tu proyecto exige confirmación de correo, la alumna deberá confirmar el email antes de iniciar sesión.</div><div class="tableWrap"><table><thead><tr><th>ALUMNA</th><th>INICIO</th><th>MÓDULO</th><th>PROGRESO</th><th>ESTADO</th><th></th></tr></thead><tbody>${rows.length?rows.map(s=>`<tr><td><b>${esc(s.display_name||s.email)}</b><br><span class="muted">${esc(s.email)}</span></td><td>${fmtDate(s.program_start_date)}</td><td>${s.current_module_position?esc(s.current_module_position)+' · '+esc(s.current_module_title):'Sin asignar'}</td><td>${Number(s.progress_percent||0).toFixed(0)}%<br><span class="muted">${s.completed_days||0}/${s.total_days||364} días</span></td><td>${tagStatus(s.student_status)}</td><td><button class="btn small" onclick="editStudent('${s.student_id}')">Administrar</button></td></tr>`).join(''):'<tr><td colspan="6">No hay alumnas.</td></tr>'}</tbody></table></div></div>`;
 $('newStudentBtn').onclick=()=>newStudentModal();
}
function moduleOptions(selected=1){return modules.map(m=>`<option value="${m.position}" ${Number(selected)===m.position?'selected':''}>${m.position} · ${esc(m.title)}</option>`).join('')}
function newStudentModal(){
 showModal(`<div class="modalHead"><h3>Crear acceso de alumna</h3><button class="close" onclick="closeModal()">×</button></div><form id="newStudentForm" class="form" style="margin-top:15px"><label class="field">Nombre<input id="nsName" class="input" required></label><label class="field">Correo<input id="nsEmail" class="input" type="email" required></label><label class="field">Contraseña temporal<input id="nsPass" class="input" type="text" minlength="6" required></label><label class="field">Fecha de inicio<input id="nsStart" class="input" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label class="field">Módulo inicial<select id="nsModule" class="select">${moduleOptions(1)}</select></label><button class="btn primary">Crear alumna</button><div id="nsMsg"></div></form>`);
 $('newStudentForm').onsubmit=async e=>{e.preventDefault();$('nsMsg').textContent='Creando…';try{const d=await authCreateStudent($('nsEmail').value.trim(),$('nsPass').value,$('nsName').value.trim());const id=d?.user?.id;if(!id)throw new Error('Supabase no devolvió el ID de la nueva cuenta. Revisa si el correo ya existe.');await api('/rest/v1/rpc/admin_place_student',{method:'POST',body:JSON.stringify({p_student:id,p_module_position:Number($('nsModule').value),p_start_date:$('nsStart').value,p_display_name:$('nsName').value.trim()})});$('nsMsg').innerHTML='<span class="success">Cuenta creada. Comparte el enlace del Campus y la contraseña temporal.</span>';setTimeout(()=>{closeModal();renderAdminStudents()},1000)}catch(x){$('nsMsg').innerHTML='<span class="error">'+esc(x.message)+'</span>'}};
}
function editStudent(id){
 const s=adminStudentsCache.find(x=>x.student_id===id);if(!s)return;
 showModal(`<div class="modalHead"><h3>${esc(s.display_name||s.email)}</h3><button class="close" onclick="closeModal()">×</button></div><form id="editStudentForm" class="form" style="margin-top:15px"><label class="field">Nombre<input id="esName" class="input" value="${esc(s.display_name||'')}"></label><label class="field">Fecha de inicio<input id="esStart" class="input" type="date" value="${esc(s.program_start_date||new Date().toISOString().slice(0,10))}"></label><label class="field">Módulo actual<select id="esModule" class="select">${moduleOptions(s.current_module_position||1)}</select></label><label class="field">Estado<select id="esStatus" class="select"><option value="active">Activa</option><option value="paused" ${s.student_status==='paused'?'selected':''}>Pausada</option><option value="inactive" ${s.student_status==='inactive'?'selected':''}>Inactiva</option></select></label><button class="btn primary">Guardar</button><div id="esMsg"></div></form>`);
 $('editStudentForm').onsubmit=async e=>{e.preventDefault();try{await api('/rest/v1/rpc/admin_place_student',{method:'POST',body:JSON.stringify({p_student:id,p_module_position:Number($('esModule').value),p_start_date:$('esStart').value,p_display_name:$('esName').value.trim()})});await api('/rest/v1/rpc/admin_update_student',{method:'POST',body:JSON.stringify({p_student:id,p_display_name:$('esName').value.trim(),p_student_status:$('esStatus').value})});$('esMsg').innerHTML='<span class="success">Cambios guardados.</span>';setTimeout(()=>{closeModal();renderAdminStudents()},700)}catch(x){$('esMsg').innerHTML='<span class="error">'+esc(x.message)+'</span>'}};
}

async function renderAdminContent(){
 $('view').innerHTML=`<div class="page"><div class="pageHead"><div><p class="eyebrow">ADMINISTRACIÓN</p><h1>Contenido</h1><p>Edita semanas, días, duración e imágenes sin cambiar el enlace del Campus.</p></div></div><section class="panel"><label class="field">Módulo<select id="contentModule" class="select">${modules.map(m=>`<option value="${m.id}">${m.position} · ${esc(m.title)}</option>`).join('')}</select></label></section><div id="contentArea"></div></div>`;
 $('contentModule').onchange=()=>loadAdminContent($('contentModule').value);loadAdminContent($('contentModule').value);
}
async function loadAdminContent(moduleId){
 $('contentArea').innerHTML='<div class="empty">Cargando semanas…</div>';
 const lessons=await api('/rest/v1/lessons?module_id=eq.'+moduleId+'&select=id,title,summary,position&order=position.asc');
 const dayGroups=await Promise.all(lessons.map(async l=>[l.id,await api('/rest/v1/lesson_days?lesson_id=eq.'+l.id+'&select=*&order=day_number.asc')]));
 const map=new Map(dayGroups);
 $('contentArea').innerHTML='<div class="list">'+lessons.map(l=>`<div class="listItem"><h4>${esc(l.title)}</h4><p>${esc(l.summary||'')}</p><div class="row">${(map.get(l.id)||[]).map(d=>`<button class="btn small" onclick="editDay('${d.id}','${l.id}')">${esc(d.day_name)}</button>`).join('')}</div></div>`).join('')+'</div>';
 window.adminDays=dayGroups.flatMap(x=>x[1]||[]);
}
function editDay(dayId,lessonId){
 const d=(window.adminDays||[]).find(x=>x.id===dayId);if(!d)return;
 showModal(`<div class="modalHead"><h3>${esc(d.day_name)} · Semana</h3><button class="close" onclick="closeModal()">×</button></div><form id="dayEditForm" class="form" style="margin-top:15px"><label class="field">Título del día<input id="dayTitleEdit" class="input" value="${esc(d.title)}"></label><label class="field">Duración estimada (minutos)<input id="dayMinutesEdit" class="input" type="number" min="1" value="${Number(d.estimated_minutes||60)}"></label><label class="field">Contenido JSON<textarea id="dayJsonEdit" class="textarea" style="min-height:240px">${esc(JSON.stringify(d.content_json||{},null,2))}</textarea></label><label class="field">Añadir imagen<input id="dayImage" class="input" type="file" accept="image/*"></label><button class="btn primary">Guardar contenido</button><div id="dayEditMsg"></div></form>`);
 $('dayEditForm').onsubmit=async e=>{e.preventDefault();try{let content=JSON.parse($('dayJsonEdit').value||'{}');const f=$('dayImage').files?.[0];if(f){const mod=modules.find(x=>x.id===$('contentModule')?.value),safe=f.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9._-]/g,'-');const path=`Modulo${mod?.position||1}/Semana${d.program_week||1}/${d.day_name}/${Date.now()}-${safe}`;const url=await uploadCampusImage(f,path);content.images=Array.isArray(content.images)?content.images:[];content.images.push({image_url:url,description:'Recurso visual de '+d.day_name})}await api('/rest/v1/lesson_days?id=eq.'+dayId,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({title:$('dayTitleEdit').value.trim(),estimated_minutes:Number($('dayMinutesEdit').value||60),content_json:content})});$('dayEditMsg').innerHTML='<span class="success">Contenido actualizado.</span>';setTimeout(()=>{closeModal();loadAdminContent($('contentModule').value)},700)}catch(x){$('dayEditMsg').innerHTML='<span class="error">'+esc(x.message)+'</span>'}};
}

async function renderAdminEvents(){
 const rows=await api('/rest/v1/campus_events?select=*&order=start_at.desc');
 $('view').innerHTML=`<div class="page"><div class="pageHead"><div><p class="eyebrow">ADMINISTRACIÓN</p><h1>Eventos</h1><p>Crea, cambia o añade eventos cualquier día de la semana.</p></div></div><section class="panel"><form id="eventForm" class="form"><div class="row"><label class="field" style="flex:1">Título<input id="evTitle" class="input" required></label><label class="field" style="flex:1">Fecha y hora<input id="evStart" class="input" type="datetime-local" required></label></div><label class="field">Descripción<textarea id="evDesc" class="textarea"></textarea></label><label class="field">Enlace de reunión<input id="evUrl" class="input" type="url"></label><label style="font-size:12px"><input id="evPublished" type="checkbox" checked> Publicado para alumnas</label><div class="row"><button class="btn primary" type="submit">${editingEventId?'Guardar cambios':'Crear evento'}</button>${editingEventId?'<button class="btn" type="button" id="cancelEventEdit">Cancelar</button>':''}</div><div id="evMsg"></div></form></section><div class="list">${rows.length?rows.map(e=>`<div class="listItem"><div class="row between"><div><h4>${esc(e.title)}</h4><p>${fmtDateTime(e.start_at)}</p></div>${e.is_published?'<span class="tag good">Publicado</span>':'<span class="tag">Borrador</span>'}</div><p>${esc(e.description||'')}</p><div class="row"><button class="btn small" onclick='startEventEdit(${JSON.stringify(JSON.stringify(e))})'>Editar</button><button class="btn danger small" onclick="deleteEvent('${e.id}')">Eliminar</button></div></div>`).join(''):'<div class="empty">No hay eventos.</div>'}</div></div>`;
 $('eventForm').onsubmit=saveEvent;if(editingEventId)$('cancelEventEdit').onclick=()=>{editingEventId=null;renderAdminEvents()};
}
function startEventEdit(str){const e=JSON.parse(str);editingEventId=e.id;renderAdminEvents().then(()=>{$('evTitle').value=e.title||'';$('evDesc').value=e.description||'';$('evUrl').value=e.meeting_url||'';$('evPublished').checked=!!e.is_published;$('evStart').value=new Date(e.start_at).toISOString().slice(0,16)})}
async function saveEvent(e){e.preventDefault();try{const body={title:$('evTitle').value.trim(),description:$('evDesc').value.trim(),start_at:new Date($('evStart').value).toISOString(),meeting_url:$('evUrl').value.trim()||null,is_published:$('evPublished').checked,created_by:user.id,updated_at:new Date().toISOString()};if(editingEventId)await api('/rest/v1/campus_events?id=eq.'+editingEventId,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});else await api('/rest/v1/campus_events',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});editingEventId=null;renderAdminEvents()}catch(x){$('evMsg').innerHTML='<span class="error">'+esc(x.message)+'</span>'}}
async function deleteEvent(id){if(!confirm('¿Eliminar este evento?'))return;await api('/rest/v1/campus_events?id=eq.'+id,{method:'DELETE'});renderAdminEvents()}

async function renderAdminPayments(){
 const [rows,students]=await Promise.all([api('/rest/v1/student_payments?select=*&order=due_date.desc&limit=100'),adminStudentsCache.length?Promise.resolve(adminStudentsCache):api('/rest/v1/rpc/admin_list_students',{method:'POST',body:'{}'})]);adminStudentsCache=students||[];
 $('view').innerHTML=`<div class="page"><div class="pageHead"><div><p class="eyebrow">ADMINISTRACIÓN</p><h1>Pagos</h1><p>El monto, historial y total acumulado solo se muestran aquí.</p></div></div><section class="panel"><form id="payForm" class="form"><label class="field">Alumna<select id="payStudent" class="select" required><option value="">Selecciona</option>${students.map(s=>`<option value="${s.student_id}">${esc(s.display_name||s.email)} · ${esc(s.email)}</option>`).join('')}</select></label><div class="row"><label class="field" style="flex:1">Monto<input id="payAmount" class="input" type="number" step=".01"></label><label class="field" style="flex:1">Fecha límite<input id="payDue" class="input" type="date" required></label><label class="field" style="flex:1">Estado<select id="payStatus" class="select"><option value="pending">Pendiente</option><option value="paid">Pagado</option><option value="overdue">Vencido</option><option value="cancelled">Cancelado</option></select></label></div><div class="row"><label class="field" style="flex:1">Método<input id="payMethod" class="input"></label><label class="field" style="flex:1">Referencia<input id="payRef" class="input"></label></div><label class="field">URL del comprobante<input id="payReceipt" class="input" type="url"></label><label class="field">Notas administrativas<textarea id="payNotes" class="textarea"></textarea></label><div class="row"><button class="btn primary">${editingPaymentId?'Guardar cambios':'Registrar pago'}</button>${editingPaymentId?'<button id="cancelPayEdit" class="btn" type="button">Cancelar</button>':''}</div><div id="payMsg"></div></form></section><div class="tableWrap"><table><thead><tr><th>ALUMNA</th><th>FECHA</th><th>MONTO</th><th>ESTADO</th><th>REFERENCIA</th><th></th></tr></thead><tbody>${rows.length?rows.map(p=>{const s=students.find(x=>x.student_id===p.student_id);return`<tr><td>${esc(s?.display_name||s?.email||p.student_id)}</td><td>${fmtDate(p.due_date)}</td><td>${money(p.amount)}</td><td>${tagStatus(p.status)}</td><td>${esc(p.reference||'—')}</td><td><button class="btn small" onclick='editPayment(${JSON.stringify(JSON.stringify(p))})'>Editar</button></td></tr>`}).join(''):'<tr><td colspan="6">Sin pagos registrados.</td></tr>'}</tbody></table></div></div>`;
 $('payForm').onsubmit=savePayment;if(editingPaymentId)$('cancelPayEdit').onclick=()=>{editingPaymentId=null;renderAdminPayments()};
}
function editPayment(str){const p=JSON.parse(str);editingPaymentId=p.id;renderAdminPayments().then(()=>{$('payStudent').value=p.student_id;$('payAmount').value=p.amount||'';$('payDue').value=p.due_date||'';$('payStatus').value=p.status||'pending';$('payMethod').value=p.method||'';$('payRef').value=p.reference||'';$('payReceipt').value=p.receipt_url||'';$('payNotes').value=p.notes||''})}
async function savePayment(e){e.preventDefault();try{const status=$('payStatus').value,body={student_id:$('payStudent').value,amount:$('payAmount').value?Number($('payAmount').value):null,due_date:$('payDue').value,status,method:$('payMethod').value.trim()||null,reference:$('payRef').value.trim()||null,receipt_url:$('payReceipt').value.trim()||null,notes:$('payNotes').value.trim()||null,paid_at:status==='paid'?new Date().toISOString():null,updated_at:new Date().toISOString()};if(editingPaymentId)await api('/rest/v1/student_payments?id=eq.'+editingPaymentId,{method:'PATCH',body:JSON.stringify(body)});else await api('/rest/v1/student_payments',{method:'POST',body:JSON.stringify(body)});editingPaymentId=null;renderAdminPayments()}catch(x){$('payMsg').innerHTML='<span class="error">'+esc(x.message)+'</span>'}}

async function renderAdminQuestions(){
 const [rows,students]=await Promise.all([api('/rest/v1/student_questions?select=*&order=created_at.desc'),adminStudentsCache.length?Promise.resolve(adminStudentsCache):api('/rest/v1/rpc/admin_list_students',{method:'POST',body:'{}'})]);adminStudentsCache=students||[];
 $('view').innerHTML=`<div class="page"><div class="pageHead"><div><p class="eyebrow">ADMINISTRACIÓN</p><h1>Dudas de alumnas</h1><p>Responde y cambia el estado de cada consulta.</p></div></div><div class="list">${rows.length?rows.map(q=>{const s=students.find(x=>x.student_id===q.student_id);return`<div class="listItem"><div class="row between"><div><h4>${esc(q.subject)}</h4><p>${esc(s?.display_name||s?.email||'Alumna')} · ${fmtDateTime(q.created_at)}</p></div>${tagStatus(q.status)}</div><p>${esc(q.message)}</p><label class="field">Respuesta<textarea id="resp-${q.id}" class="textarea">${esc(q.admin_response||'')}</textarea></label><div class="row"><select id="qs-${q.id}" class="select" style="width:auto"><option value="open" ${q.status==='open'?'selected':''}>Abierta</option><option value="pending" ${q.status==='pending'?'selected':''}>Pendiente</option><option value="answered" ${q.status==='answered'?'selected':''}>Respondida</option><option value="closed" ${q.status==='closed'?'selected':''}>Cerrada</option></select><button class="btn primary small" onclick="saveQuestionResponse('${q.id}')">Guardar respuesta</button><span id="qm-${q.id}"></span></div></div>`}).join(''):'<div class="empty">No hay dudas registradas.</div>'}</div></div>`;
}
async function saveQuestionResponse(id){try{const status=$('qs-'+id).value;await api('/rest/v1/student_questions?id=eq.'+id,{method:'PATCH',body:JSON.stringify({admin_response:$('resp-'+id).value.trim(),status,responded_at:status==='answered'?new Date().toISOString():null,updated_at:new Date().toISOString()})});$('qm-'+id).innerHTML='<span class="success">Guardado.</span>'}catch(x){$('qm-'+id).innerHTML='<span class="error">'+esc(x.message)+'</span>'}}

$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').hidden=true;$('loginBtn').disabled=true;$('loginBtn').textContent='Entrando…';try{session=await authLogin($('email').value.trim(),$('password').value);user=session.user;localStorage.setItem('kosmik_session',JSON.stringify(session));await boot()}catch(x){$('loginError').textContent='No pudimos iniciar sesión: '+x.message;$('loginError').hidden=false}finally{$('loginBtn').disabled=false;$('loginBtn').textContent='Entrar al Campus'}};
$('logoutBtn').onclick=()=>{localStorage.removeItem('kosmik_session');location.reload()};
$('themeBtn').onclick=()=>{const t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t;localStorage.setItem('kosmik-theme',t)};
document.documentElement.dataset.theme=localStorage.getItem('kosmik-theme')||'dark';

(async()=>{try{const raw=localStorage.getItem('kosmik_session');if(raw){session=JSON.parse(raw);user=session?.user;if(session?.refresh_token)await refreshSession();if(user)await boot()}}catch{localStorage.removeItem('kosmik_session')}})();
</script>
</body>
