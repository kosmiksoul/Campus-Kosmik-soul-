<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Campus Kosmik Soul</title>
<style>
:root{--bg:#08080c;--p:#131319;--p2:#1a1920;--t:#fff;--m:#aaa2ad;--l:#2c2730;--pink:#ff4fa3;--good:#78dbaa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}[hidden]{display:none!important}.btn{border:1px solid var(--l);background:var(--p2);color:var(--t);border-radius:11px;padding:10px 12px;font-weight:800}.primary{border:0;background:linear-gradient(135deg,var(--pink),#c73384)}.input,.textarea,.select{width:100%;background:var(--p2);border:1px solid var(--l);color:var(--t);border-radius:11px;padding:11px}.textarea{min-height:90px}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,500px);background:var(--p);border:1px solid var(--l);border-radius:24px;padding:25px}.brand{display:flex;gap:11px;align-items:center}.mark,.avatar{display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),#8738ff);font-weight:950}.mark{width:48px;height:48px;border-radius:14px}.avatar{width:38px;height:38px;border-radius:50%}.hero{padding:28px 0 18px}.hero h1{font-size:36px;margin:8px 0}.muted{color:var(--m)}.form{display:grid;gap:11px}.field{display:grid;gap:6px;font-size:12px;font-weight:800}.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--l);background:#09090deF}.shell{max-width:1250px;margin:auto;padding:16px}.nav{display:flex;gap:7px;overflow:auto;margin:14px 0}.nav .active{border-color:var(--pink);color:var(--pink)}.welcome,.panel,.module,.day,.activity{background:var(--p);border:1px solid var(--l);border-radius:18px}.welcome{padding:21px}.welcome h1{font-size:31px;margin:7px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.stat{background:var(--p);border:1px solid var(--l);border-radius:15px;padding:14px}.stat b{font-size:23px}.stat small{display:block;color:var(--m);margin-top:4px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.module{padding:15px;min-height:145px}.module.locked{opacity:.5}.module h3{margin:9px 0}.pill{display:inline-block;border:1px solid #ff4fa355;color:var(--pink);background:#ff4fa311;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900}.week{background:var(--p);border:1px solid var(--l);border-radius:16px;overflow:hidden;margin-top:10px}.week>summary,.day>summary{cursor:pointer;padding:14px;font-weight:900}.weekbody{padding:12px;border-top:1px solid var(--l)}.day{margin-top:9px;background:var(--p2)}.daybody{padding:12px;border-top:1px solid var(--l)}.activity{padding:12px;margin-top:9px}.activity h4{margin:0 0 6px}.activity p{font-size:12px;color:var(--m)}.progress{height:8px;border-radius:99px;overflow:hidden;background:var(--p2);margin-top:9px}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--pink),#8d3eff)}.list{display:grid;gap:9px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--l);padding:10px;font-size:12px;text-align:left}.panel{padding:16px}.error{color:#ff9ba5;font-size:12px}.good{color:var(--good)}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:450px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<main id="auth" class="auth"><section class="card"><div class="brand"><div class="mark">K</div><div><small style="color:var(--pink);font-weight:900">CAMPUS OFICIAL</small><h2 style="margin:2px 0">Kosmik Soul</h2></div></div><div class="hero"><span class="pill">Diplomado anual</span><h1>Tu espacio de aprendizaje.</h1><p class="muted">Numerología es el primer módulo y está disponible desde el inicio.</p></div><form id="loginForm" class="form"><label class="field">Correo<input id="email" class="input" type="email" required></label><label class="field">Contraseña<input id="password" class="input" type="password" required></label><button class="btn primary">Entrar al Campus</button><div id="loginErr" class="error"></div></form></section></main>
<div id="app" hidden><header class="top"><div><small style="color:var(--pink);font-weight:900">CAMPUS KOSMIK SOUL</small><h3 id="pageTitle" style="margin:2px 0">Inicio</h3></div><div class="row"><span id="adminTag" class="pill" hidden>ADMIN</span><div id="avatar" class="avatar">KS</div><button id="logout" class="btn">Salir</button></div></header><div class="shell"><div id="nav" class="nav"></div><div id="view"></div></div></div>
<script>
const U='https://vsuijjdxrpopwmvwdpyv.supabase.co',K='sb_publishable_CEFUma5AmfzdUkCEAxUEAA_0A9vRQ9F';
const ADMIN='kosmicastral@gmail.com';
const MODULES=[{"title": "Numerología", "weeks": 5}, {"title": "Fundamentos Espirituales", "weeks": 4}, {"title": "Registros Akáshicos", "weeks": 4}, {"title": "Manifestación consciente", "weeks": 4}, {"title": "Cristales y cuarzos", "weeks": 4}, {"title": "Astrología", "weeks": 12}, {"title": "Chakras", "weeks": 3}, {"title": "Meditación", "weeks": 2}, {"title": "Tarot", "weeks": 5}, {"title": "Hierbas y herbolaria", "weeks": 3}, {"title": "Protección energética", "weeks": 2}, {"title": "Ciclos lunares y rituales", "weeks": 2}, {"title": "Oráculos", "weeks": 2}];
const NUM_TOPICS=["Introducción y reducción numérica", "Significado de los números 1 al 9", "Números maestros 11, 22 y 33", "Camino de vida", "Número del día de nacimiento", "Número de actitud", "Expresión y personalidad", "Alma y motivación interna", "Ciclos personales", "Año personal", "Mes personal", "Día personal", "Pináculos y desafíos", "Lecciones kármicas", "Deudas kármicas", "Matriz numerológica", "Lectura integral básica", "Compatibilidad: camino de vida", "Compatibilidad: fortalezas y retos", "Compatibilidad en pareja", "Compatibilidad familiar", "Compatibilidad en amistad y trabajo", "Números maestros en compatibilidad", "Casos prácticos de compatibilidad", "Ética de la lectura numerológica", "Cómo formular una devolución", "Práctica guiada de lectura", "Caso completo 1", "Caso completo 2", "Interpretación comparativa", "Integración de cálculos", "Errores comunes", "Práctica supervisada", "Repaso general", "Evaluación final de Numerología"];
let s=null,u=null,student=null,isAdmin=false,progress=new Map();
const $=x=>document.getElementById(x),esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const words=t=>String(t||'').trim().split(/\s+/).filter(Boolean).length;
async function req(path,opt={}){const r=await fetch(U+path,{...opt,headers:{apikey:K,'Content-Type':'application/json',...(s?.access_token?{Authorization:'Bearer '+s.access_token}:{}),...(opt.headers||{})}});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw new Error(d?.message||d?.msg||d?.error||'Error');return d}
async function login(e,p){const r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})});const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.message);return d}
async function boot(){isAdmin=(u.email||'').toLowerCase()===ADMIN; $('adminTag').hidden=!isAdmin; $('auth').hidden=true;$('app').hidden=false;$('avatar').textContent=(u.email||'KS').slice(0,2).toUpperCase(); if(!isAdmin){const rows=await req('/rest/v1/ks_students?user_id=eq.'+u.id+'&select=*');student=rows?.[0]||{start_date:new Date().toISOString().slice(0,10),current_module:1};const pr=await req('/rest/v1/ks_progress?user_id=eq.'+u.id+'&select=*');progress=new Map((pr||[]).map(x=>[x.activity_id,x]))} renderNav();go(isAdmin?'admin':'home')}
function renderNav(){const items=isAdmin?[['admin','Resumen'],['students','Alumnas'],['eventsAdmin','Eventos'],['paymentsAdmin','Pagos'],['questionsAdmin','Dudas']]:[['home','Inicio'],['learning','Mi aprendizaje'],['events','Eventos'],['payments','Pagos'],['questions','Tengo una duda']];$('nav').innerHTML=items.map(x=>`<button class="btn" data-v="${x[0]}">${x[1]}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.v))}
async function go(v){$('nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));$('pageTitle').textContent=v;if(v==='home')renderHome();if(v==='learning')renderLearning();if(v==='events')await renderEvents();if(v==='payments')await renderPayments();if(v==='questions')await renderQuestions();if(v==='admin')await renderAdmin();if(v==='students')await renderStudents();if(v==='eventsAdmin')await renderEventsAdmin();if(v==='paymentsAdmin')await renderPaymentsAdmin();if(v==='questionsAdmin')await renderQuestionsAdmin()}
function completedCount(){return [...progress.values()].filter(x=>x.completed).length}
function renderHome(){const n=student?.display_name||u.email.split('@')[0],done=completedCount(),pct=Math.min(100,Math.round(done/350*100));$('view').innerHTML=`<section class="welcome"><span class="pill">Módulo 1 · Numerología</span><h1>Hola, ${esc(n)}</h1><p class="muted">Tu programa comienza directamente con Numerología. Cada día tiene 10 actividades y una duración estimada de 60 minutos.</p><div class="progress"><span style="width:${pct}%"></span></div></section><div class="stats"><div class="stat"><small>MÓDULO ACTUAL</small><b>1</b><small>Numerología</small></div><div class="stat"><small>INICIO</small><b style="font-size:17px">${student?.start_date||'Hoy'}</b></div><div class="stat"><small>ACTIVIDADES HECHAS</small><b>${done}</b></div><div class="stat"><small>DURACIÓN DIARIA</small><b>60 min</b></div></div>`}
function topicFor(day){return NUM_TOPICS[(day-1)%NUM_TOPICS.length]||'Práctica numerológica'}
function activityId(day,n){return `num-d${day}-a${n}`}
function available(day){const st=new Date((student?.start_date||new Date().toISOString().slice(0,10))+'T00:00:00');const unlock=new Date(st);unlock.setDate(unlock.getDate()+day-1);return new Date()>=unlock}
function activityCard(day,n){const id=activityId(day,n),done=progress.get(id)?.completed,topic=topicFor(day);const prompts=[`Explica con tus palabras una idea importante sobre ${topic}.`,`Escribe un ejemplo práctico relacionado con ${topic}.`,`Menciona una diferencia que hayas aprendido en este tema.`,`Realiza un cálculo o procedimiento relacionado con ${topic} y anota el resultado.`,`Escribe una posible fortaleza asociada al tema de hoy.`,`Escribe un posible reto o error común relacionado con ${topic}.`,`Explica cómo usarías este conocimiento en una lectura.`,`Relaciona el tema de hoy con un ejemplo de una persona ficticia.`,`Resume qué parte te pareció más importante.`,`Escribe qué quieres recordar antes de terminar el día.`];return `<div class="activity"><h4>${n}. ${esc(topic)}</h4><p>${esc(prompts[n-1])}</p><textarea id="${id}" class="textarea" placeholder="Mínimo 3 palabras...">${esc(progress.get(id)?.response_text||'')}</textarea><button class="btn primary" onclick="saveAct('${id}')">${done?'✓ Completada':'Guardar actividad'}</button></div>`}
async function saveAct(id){const t=$(id).value.trim();if(words(t)<3)return alert('Escribe al menos 3 palabras.');await req('/rest/v1/ks_progress?on_conflict=user_id,activity_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:JSON.stringify({user_id:u.id,activity_id:id,completed:true,response_text:t,updated_at:new Date().toISOString()})});progress.set(id,{completed:true,response_text:t});alert('Actividad guardada');}
function renderLearning(){$('view').innerHTML=`<div class="grid">${MODULES.map((m,i)=>`<div class="module ${i+1>(student?.current_module||1)?'locked':''}"><span class="pill">MÓDULO ${i+1}</span><h3>${esc(m.title)}</h3><p class="muted">${m.weeks} semanas</p>${i===0?'<button class="btn primary" onclick="openNumerology()">Abrir Numerología</button>':i+1<=(student?.current_module||1)?'<button class="btn">Abrir</button>':'🔒 Bloqueado'}</div>`).join('')}</div>`}
function openNumerology(){let h='<button class="btn" onclick="go(\'learning\')">← Volver</button><h1>Numerología</h1><p class="muted">5 semanas · 35 días · 10 actividades por día</p>';for(let w=1;w<=5;w++){h+=`<details class="week" ${w===1?'open':''}><summary>Semana ${w}</summary><div class="weekbody">`;for(let d=1;d<=7;d++){const day=(w-1)*7+d,av=available(day);h+=`<details class="day" ${d===1&&w===1?'open':''}><summary>${['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'][d-1]} · Día ${day} · ${esc(topicFor(day))} ${av?'<span class="pill">60 min</span>':'🔒'}</summary><div class="daybody">${av?Array.from({length:10},(_,i)=>activityCard(day,i+1)).join(''):'<div class="muted">Se desbloquea según tu fecha de inicio.</div>'}</div></details>`}h+='</div></details>'}$('view').innerHTML=h}
async function renderEvents(){const r=await req('/rest/v1/ks_events?published=eq.true&select=*&order=start_at.asc');$('view').innerHTML='<h1>Eventos</h1><div class="list">'+(r.length?r.map(e=>`<div class="panel"><b>${esc(e.title)}</b><p class="muted">${new Date(e.start_at).toLocaleString('es-MX')}</p><p>${esc(e.description||'')}</p>${e.meeting_url?`<a class="btn primary" href="${esc(e.meeting_url)}" target="_blank">Entrar</a>`:''}</div>`).join(''):'<div class="panel">No hay eventos publicados.</div>')+'</div>'}
async function renderPayments(){const r=await req('/rest/v1/ks_payments?user_id=eq.'+u.id+'&select=*&order=due_date.desc');$('view').innerHTML='<h1>Pagos</h1><div class="list">'+(r.length?r.map(p=>`<div class="panel"><b>Fecha: ${esc(p.due_date)}</b><p class="muted">Estado: ${esc(p.status)}</p>${p.receipt_url?`<a href="${esc(p.receipt_url)}" target="_blank">Ver comprobante</a>`:''}</div>`).join(''):'<div class="panel">Sin pagos registrados.</div>')+'</div>'}
async function renderQuestions(){const r=await req('/rest/v1/ks_questions?user_id=eq.'+u.id+'&select=*&order=created_at.desc');$('view').innerHTML=`<h1>Tengo una duda</h1><div class="panel"><input id="qs" class="input" placeholder="Asunto"><textarea id="qm" class="textarea" placeholder="Escribe tu duda"></textarea><button class="btn primary" onclick="sendQ()">Enviar</button></div><div class="list">${r.map(q=>`<div class="panel"><b>${esc(q.subject)}</b><p>${esc(q.message)}</p>${q.response?`<p class="good">Respuesta: ${esc(q.response)}</p>`:''}</div>`).join('')}</div>`}
async function sendQ(){await req('/rest/v1/ks_questions',{method:'POST',body:JSON.stringify({user_id:u.id,subject:$('qs').value,message:$('qm').value})});renderQuestions()}
async function renderAdmin(){const [st,ev,pay,q]=await Promise.all([req('/rest/v1/ks_students?select=*'),req('/rest/v1/ks_events?select=*'),req('/rest/v1/ks_payments?select=*'),req('/rest/v1/ks_questions?select=*')]);$('view').innerHTML=`<div class="stats"><div class="stat"><small>ALUMNAS</small><b>${st.length}</b></div><div class="stat"><small>EVENTOS</small><b>${ev.length}</b></div><div class="stat"><small>PAGOS</small><b>${pay.length}</b></div><div class="stat"><small>DUDAS</small><b>${q.filter(x=>x.status!=='answered').length}</b></div></div><div class="panel"><h3>Alta de alumnas</h3><p class="muted">Crea el usuario en Supabase → Authentication → Users. Esta versión lo inscribe automáticamente en Numerología.</p></div>`}
async function renderStudents(){const r=await req('/rest/v1/ks_students?select=*&order=created_at.desc');window.ST=r;$('view').innerHTML=`<h1>Alumnas</h1><table><tr><th>Nombre</th><th>Correo</th><th>Inicio</th><th>Módulo</th><th></th></tr>${r.map(x=>`<tr><td>${esc(x.display_name)}</td><td>${esc(x.email)}</td><td><input id="d-${x.user_id}" class="input" type="date" value="${x.start_date}"></td><td><select id="m-${x.user_id}" class="select">${MODULES.map((m,i)=>`<option value="${i+1}" ${x.current_module===i+1?'selected':''}>${i+1} · ${esc(m.title)}</option>`).join('')}</select></td><td><button class="btn" onclick="saveStudent('${x.user_id}')">Guardar</button></td></tr>`).join('')}</table>`}
async function saveStudent(id){await req('/rest/v1/ks_students?user_id=eq.'+id,{method:'PATCH',body:JSON.stringify({start_date:$('d-'+id).value,current_module:Number($('m-'+id).value),updated_at:new Date().toISOString()})});alert('Alumna actualizada')}
async function renderEventsAdmin(){const r=await req('/rest/v1/ks_events?select=*&order=start_at.desc');$('view').innerHTML=`<h1>Eventos</h1><div class="panel"><input id="et" class="input" placeholder="Título"><input id="ed" class="input" type="datetime-local"><textarea id="ee" class="textarea" placeholder="Descripción"></textarea><input id="eu" class="input" placeholder="Enlace"><button class="btn primary" onclick="addEvent()">Crear evento</button></div>${r.map(e=>`<div class="panel"><b>${esc(e.title)}</b> · ${new Date(e.start_at).toLocaleString('es-MX')}</div>`).join('')}`}
async function addEvent(){await req('/rest/v1/ks_events',{method:'POST',body:JSON.stringify({title:$('et').value,start_at:new Date($('ed').value).toISOString(),description:$('ee').value,meeting_url:$('eu').value,published:true})});renderEventsAdmin()}
async function renderPaymentsAdmin(){const [p,st]=await Promise.all([req('/rest/v1/ks_payments?select=*&order=due_date.desc'),req('/rest/v1/ks_students?select=*')]);$('view').innerHTML=`<h1>Pagos</h1><div class="panel"><select id="pu" class="select">${st.map(x=>`<option value="${x.user_id}">${esc(x.display_name||x.email)}</option>`).join('')}</select><input id="pd" class="input" type="date"><input id="pa" class="input" type="number" placeholder="Monto"><select id="ps" class="select"><option value="pending">Pendiente</option><option value="paid">Pagado</option></select><button class="btn primary" onclick="addPay()">Registrar</button></div>${p.map(x=>`<div class="panel">${esc(x.due_date)} · ${esc(x.status)} · $${esc(x.amount||0)}</div>`).join('')}`}
async function addPay(){await req('/rest/v1/ks_payments',{method:'POST',body:JSON.stringify({user_id:$('pu').value,due_date:$('pd').value,amount:Number($('pa').value||0),status:$('ps').value,paid_at:$('ps').value==='paid'?new Date().toISOString():null})});renderPaymentsAdmin()}
async function renderQuestionsAdmin(){const r=await req('/rest/v1/ks_questions?select=*&order=created_at.desc');$('view').innerHTML='<h1>Dudas</h1>'+r.map(q=>`<div class="panel"><b>${esc(q.subject)}</b><p>${esc(q.message)}</p><textarea id="r-${q.id}" class="textarea">${esc(q.response||'')}</textarea><button class="btn primary" onclick="answerQ('${q.id}')">Responder</button></div>`).join('')}
async function answerQ(id){await req('/rest/v1/ks_questions?id=eq.'+id,{method:'PATCH',body:JSON.stringify({response:$('r-'+id).value,status:'answered',responded_at:new Date().toISOString()})});renderQuestionsAdmin()}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginErr').textContent='';try{s=await login($('email').value.trim(),$('password').value);u=s.user;localStorage.setItem('ks_session',JSON.stringify(s));boot()}catch(x){$('loginErr').textContent=x.message}};
$('logout').onclick=()=>{localStorage.removeItem('ks_session');location.reload()};
(async()=>{try{const x=localStorage.getItem('ks_session');if(x){s=JSON.parse(x);u=s.user;if(u)boot()}}catch{}})();
</script>
</body></html>
